<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Roteiros — Grupo Nova Opção</title>
    <meta name="description" content="Gestão de roteiros, expedição e execução técnica do Grupo Nova Opção." />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Instalado na tela inicial: sem barra do navegador, com a cor da marca no topo. -->
    <meta name="theme-color" content="#12365a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- "black": barra de status opaca, com o conteúdo COMEÇANDO abaixo dela.
         Com "black-translucent" o app desenha por baixo da barra do sistema, e os
         ~47px do topo do cabeçalho ficam intocáveis no iPhone instalado. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Roteiros" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Uso interno: nada daqui deve aparecer em busca. -->
    <meta name="robots" content="noindex, nofollow" />
  </head>
  <body>
    <div id="root"></div>
    <div id="print-root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
